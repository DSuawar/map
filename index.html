<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Моніторинг АЗС та Дата-центрів Києва</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            height: 100dvh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        #map {
            height: 100%;
            width: 100%;
            z-index: 1;
            background: #e2e8f0;
        }

        /* Bottom sheet drawer for mobile devices */
        .bottom-sheet {
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), height 0.3s ease;
        }
        .bottom-sheet.collapsed {
            transform: translateY(calc(100% - 62px));
        }

        /* Фіксовані маркери з точним голковим анкером (без зсуву та плавання) */
        .leaflet-marker-icon.custom-pin {
            background: transparent !important;
            border: none !important;
            /* Забороняємо будь-які relative або transitions, що ламають зум у Leaflet */
            will-change: transform;
            contain: layout style;
        }

        .pin-wrapper {
            position: relative;
            width: 32px;
            height: 42px;
            pointer-events: auto;
        }

        .pin-svg {
            width: 32px;
            height: 42px;
            display: block;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.45));
        }

        .pin-icon-inner {
            position: absolute;
            top: 4px;
            left: 0;
            width: 32px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 12px;
            pointer-events: none;
        }

        /* Flame animation overlay - жорстко над вістрям маркера */
        .flame-badge {
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 19px;
            filter: drop-shadow(0 0 5px #ef4444) drop-shadow(0 0 8px #f97316);
            animation: flameFlicker 0.8s infinite alternate ease-in-out;
            pointer-events: none;
            z-index: 25;
        }

        @keyframes flameFlicker {
            0% {
                transform: translateX(-50%) scale(0.92) rotate(-3deg);
            }
            100% {
                transform: translateX(-50%) scale(1.15) rotate(3deg) translateY(-2px);
            }
        }

        .prio-star {
            position: absolute;
            top: -4px;
            right: -4px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #facc15;
            color: #713f12;
            border: 1.5px solid #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            font-weight: 900;
            box-shadow: 0 0 6px rgba(250, 204, 21, 0.9);
            z-index: 20;
        }

        .leaflet-popup-content-wrapper {
            border-radius: 14px;
            padding: 0;
            overflow: hidden;
            box-shadow: 0 12px 30px rgba(0,0,0,0.3);
            background: #1e293b;
            color: #f8fafc;
        }
        .leaflet-popup-content {
            margin: 0;
            font-size: 13px;
        }
        .leaflet-popup-tip {
            background: #1e293b;
        }

        /* Hide horizontal scrollbar in header */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-slate-900 flex flex-col h-[100dvh] overflow-hidden select-none">

    <!-- Top App Header with Integrated Mode Switcher -->
    <header class="bg-slate-900 border-b border-slate-800 text-white z-30 shrink-0 shadow-md">
        <!-- Top branding bar -->
        <div class="px-3 py-2 sm:px-4 flex justify-between items-center">
            <div class="flex items-center gap-2.5">
                <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center text-white shadow-md">
                    <i class="fa-solid fa-map-location-dot text-sm"></i>
                </div>
                <div>
                    <h1 class="text-sm sm:text-base font-bold tracking-tight leading-tight">Моніторинг об'єктів Києва</h1>
                    <p class="text-[10px] sm:text-xs text-slate-400">АЗС та Дата-центри (ЦОД)</p>
                </div>
            </div>

            <!-- Total active counter -->
            <div class="text-right">
                <span id="active-count-label" class="text-xs bg-slate-800 border border-slate-700 text-slate-200 px-2.5 py-1 rounded-lg font-semibold inline-block">
                    42 об'єкти
                </span>
            </div>
        </div>

        <!-- Mode Switcher Navigation in Header -->
        <div class="px-2.5 pb-2 pt-0.5 overflow-x-auto no-scrollbar flex items-center gap-1.5 sm:gap-2">
            <button class="mode-btn px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition-all bg-blue-600 text-white shadow-sm" data-mode="all">
                <i class="fa-solid fa-layer-group mr-1"></i> Всі (42)
            </button>
            <button class="mode-btn px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition-all bg-slate-800 text-slate-300 hover:bg-slate-700" data-mode="dc">
                <i class="fa-solid fa-server mr-1 text-sky-400"></i> Дата-центри (24)
            </button>
            <button class="mode-btn px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition-all bg-slate-800 text-slate-300 hover:bg-slate-700" data-mode="dc-prio">
                <i class="fa-solid fa-star mr-1 text-amber-400"></i> ЦОД 1-а черга (7)
            </button>
            <button class="mode-btn px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition-all bg-slate-800 text-slate-300 hover:bg-slate-700" data-mode="gas">
                <i class="fa-solid fa-gas-pump mr-1 text-emerald-400"></i> Всі АЗС (18)
            </button>
            <button class="mode-btn px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition-all bg-slate-800 text-slate-300 hover:bg-slate-700" data-mode="burned">
                <i class="fa-solid fa-fire mr-1 text-red-400"></i> 🔥 Згорілі (9)
            </button>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 relative overflow-hidden flex flex-col md:flex-row">
        <!-- Map Canvas -->
        <section class="absolute inset-0 md:relative md:flex-1 h-full w-full">
            <div id="map"></div>

            <!-- Recenter View floating action button -->
            <button id="btn-recenter" 
                    title="Показати всі точки Києва"
                    class="absolute top-3 right-3 z-[15] bg-slate-900/90 hover:bg-slate-900 text-white p-3 rounded-xl shadow-lg border border-slate-700 flex items-center justify-center active:scale-95 transition-all">
                <i class="fa-solid fa-expand text-sm"></i>
            </button>
        </section>

        <!-- Sidebar / Bottom Sheet for Mobile -->
        <aside id="sidebar-panel" 
               class="bottom-sheet collapsed fixed bottom-0 left-0 right-0 md:static md:translate-y-0 w-full md:w-80 lg:w-96 bg-slate-900/95 md:bg-slate-900 text-white shadow-2xl flex flex-col h-[70vh] md:h-full z-20 rounded-t-2xl md:rounded-none border-t md:border-t-0 md:border-l border-slate-800 backdrop-blur-md">
            
            <!-- Mobile Grab Handle & Drawer Toggle -->
            <div id="drawer-toggle" class="p-2.5 border-b border-slate-800 flex flex-col items-center cursor-pointer select-none">
                <div class="w-12 h-1 bg-slate-600 rounded-full md:hidden mb-1.5"></div>
                <div class="w-full flex justify-between items-center px-1">
                    <span class="text-xs font-bold text-slate-300 uppercase tracking-wider flex items-center gap-1.5">
                        <i class="fa-solid fa-list text-blue-400 text-xs"></i> Список адрес
                    </span>
                    <button class="md:hidden text-[11px] text-slate-400 flex items-center gap-1 font-medium bg-slate-800 px-2 py-0.5 rounded">
                        <span id="drawer-label">Показати список</span>
                        <i id="drawer-icon" class="fa-solid fa-chevron-up text-[9px] transition-transform"></i>
                    </button>
                </div>
            </div>

            <!-- Scrollable list of locations -->
            <ul id="location-list" class="flex-1 overflow-y-auto p-2.5 space-y-2 overscroll-contain">
                <!-- Injected via JavaScript -->
            </ul>
        </aside>
    </main>

    <script>
        // 18 АЗС Києва з вивіреними географічними координатами
        const gasStations = [
            { id: 'gas-1', type: 'gas', name: "АЗС на Палладіна", address: "просп. Академіка Палладіна, 46А", lat: 50.48530, lon: 30.35820, burned: false },
            { id: 'gas-2', type: 'gas', name: "АЗС на Бандери", address: "просп. Степана Бандери, 25", lat: 50.48970, lon: 30.50500, burned: true },
            { id: 'gas-3', type: 'gas', name: "АЗС на Шухевича", address: "просп. Романа Шухевича, 17", lat: 50.49650, lon: 30.59820, burned: true },
            { id: 'gas-4', type: 'gas', name: "АЗС на Харківському", address: "Харківське шосе, 210", lat: 50.40420, lon: 30.67280, burned: false },
            { id: 'gas-5', type: 'gas', name: "АЗС на Луговій", address: "вул. Лугова, 13Б", lat: 50.49980, lon: 30.46780, burned: false },
            { id: 'gas-6', type: 'gas', name: "АЗС на Новокостянтинівській", address: "вул. Новокостянтинівська, 4В", lat: 50.47700, lon: 30.48420, burned: false },
            { id: 'gas-7', type: 'gas', name: "АЗС на Братиславській (48)", address: "вул. Братиславська, 48", lat: 50.48910, lon: 30.61200, burned: false },
            { id: 'gas-8', type: 'gas', name: "АЗС на Братиславській (7Б)", address: "вул. Братиславська, 7Б", lat: 50.46120, lon: 30.61710, burned: false },
            { id: 'gas-9', type: 'gas', name: "АЗС на Зодчих", address: "вул. Зодчих, 5А", lat: 50.42850, lon: 30.38570, burned: false },
            { id: 'gas-10', type: 'gas', name: "АЗС на Кільцевій дорозі", address: "Кільцева дорога, 5", lat: 50.41320, lon: 30.41620, burned: false },
            { id: 'gas-11', type: 'gas', name: "АЗС на Васильківській", address: "вул. Васильківська, 22", lat: 50.39800, lon: 30.49910, burned: false },
            { id: 'gas-12', type: 'gas', name: "АЗС на Лобановського", address: "просп. Валерія Лобановського, 115", lat: 50.40950, lon: 30.51080, burned: false },
            { id: 'gas-13', type: 'gas', name: "АЗС на Науки", address: "просп. Науки, 5", lat: 50.40630, lon: 30.52620, burned: true },
            { id: 'gas-14', type: 'gas', name: "АЗС на Залізничному", address: "Залізничне шосе, 1А", lat: 50.40980, lon: 30.53890, burned: false },
            { id: 'gas-15', type: 'gas', name: "АЗС на Дніпровській набережній", address: "Дніпровська набережна, 13Б", lat: 50.40450, lon: 30.61480, burned: false },
            { id: 'gas-16', type: 'gas', name: "АЗС на Соборності", address: "просп. Соборності, 28А", lat: 50.44120, lon: 30.60150, burned: false },
            { id: 'gas-17', type: 'gas', name: "АЗС на Бажана", address: "просп. Миколи Бажана, 1А", lat: 50.39520, lon: 30.61050, burned: true },
            { id: 'gas-18', type: 'gas', name: "АЗС на Столичному", address: "Столичне шосе, 104Б", lat: 50.34950, lon: 30.56300, burned: false }
        ];

        // 24 Дата-центри Києва з відкаліброваними точними локаціями
        const dataCenters = [
            { id: 'dc-1-1', type: 'dc', name: "Центр обробки даних (Майданчик 1)", address: "вул. Ділова / Фізкультури", lat: 50.4358028, lon: 30.5001240, priority: true, burned: true },
            { id: 'dc-1-2', type: 'dc', name: "Центр обробки даних (Майданчик 2)", address: "район Солом'янки", lat: 50.4298735, lon: 30.4742440, priority: true, burned: true },
            { id: 'dc-2-1', type: 'dc', name: 'ЦОД “Бі-мобайл” (Майданчик 1)', address: "вул. Скляренка (Куренівка)", lat: 50.4935800, lon: 30.4711146, priority: false, burned: false },
            { id: 'dc-2-2', type: 'dc', name: 'ЦОД “Бі-мобайл” (Майданчик 2)', address: "вул. Скляренка (Куренівка)", lat: 50.4939171, lon: 30.4754537, priority: true, burned: false },
            { id: 'dc-3-1', type: 'dc', name: 'ЦОД “De novo” (Об\'єкт 1)', address: "Північно-Сирецька / Палладіна", lat: 50.4899561, lon: 30.4126668, priority: false, burned: false },
            { id: 'dc-3-2', type: 'dc', name: 'ЦОД “De novo” (Об\'єкт 2)', address: "Північно-Сирецька / Палладіна", lat: 50.4887888, lon: 30.4188357, priority: true, burned: false },
            { id: 'dc-3-3', type: 'dc', name: 'ЦОД “De novo” (Об\'єкт 3)', address: "Північно-Сирецька / Палладіна", lat: 50.4863149, lon: 30.4151780, priority: false, burned: false },
            { id: 'dc-4', type: 'dc', name: 'ЦОД “Київстар-2”', address: "вул. Дегтярівська", lat: 50.4832264, lon: 30.4827060, priority: true, burned: false },
            { id: 'dc-5', type: 'dc', name: 'ЦОД “Парковий”', address: "Паркова дорога, 16А", lat: 50.4491435, lon: 30.5411057, priority: true, burned: true },
            { id: 'dc-6-1', type: 'dc', name: 'ЦОД “Датагруп” (Вузлова 1)', address: "вул. Сім'ї Прахових", lat: 50.4451493, lon: 30.5102242, priority: false, burned: false },
            { id: 'dc-6-2', type: 'dc', name: 'ЦОД “Датагруп” (Вузлова 2)', address: "вул. Смоленська (Бродських)", lat: 50.4506164, lon: 30.4446108, priority: true, burned: true },
            { id: 'dc-7', type: 'dc', name: 'ЦОД “Київстар”', address: "вул. Дегтярівська, 53", lat: 50.4850015, lon: 30.4836832, priority: false, burned: false },
            { id: 'dc-8', type: 'dc', name: 'ЦОД “Cosmonova”', address: "просп. Валерія Лобановського", lat: 50.4248093, lon: 30.5063352, priority: false, burned: true },
            { id: 'dc-9-1', type: 'dc', name: 'ЦОД “Воля” (Майданчик 1)', address: "вул. Генерала Потапова", lat: 50.4207281, lon: 30.3948590, priority: false, burned: false },
            { id: 'dc-9-2', type: 'dc', name: 'ЦОД “Воля” (Майданчик 2)', address: "вул. Тепловозна (Дарниця / Позняки)", lat: 50.4179995, lon: 30.5494628, priority: false, burned: false },
            { id: 'dc-10', type: 'dc', name: 'ЦОД “Xentime”', address: "вул. Лук'янівська", lat: 50.4645567, lon: 30.4866291, priority: false, burned: false },
            { id: 'dc-11', type: 'dc', name: 'ЦОД “Київстар-1”', address: "вул. Дегтярівська", lat: 50.4591506, lon: 30.4265655, priority: false, burned: false },
            { id: 'dc-12', type: 'dc', name: 'Комерційний центр ЦОД', address: "вул. Леонтовича / Володимирська", lat: 50.4535484, lon: 30.4900305, priority: false, burned: false },
            { id: 'dc-13', type: 'dc', name: 'ЦОД “Wnet Kyiv 1”', address: "вул. Жилянська", lat: 50.4476248, lon: 30.5069528, priority: false, burned: false },
            { id: 'dc-14', type: 'dc', name: 'ЦОД “Wnet Kyiv 2”', address: "вул. Володимирська", lat: 50.4461352, lon: 30.5096372, priority: false, burned: false },
            { id: 'dc-15', type: 'dc', name: 'ЦОД “Freehost.ua”', address: "вул. Тарасівська", lat: 50.4456755, lon: 30.5024631, priority: false, burned: false },
            { id: 'dc-16', type: 'dc', name: 'ЦОД “Ukraine Data Network”', address: "вул. Володимирська", lat: 50.4454328, lon: 30.5112799, priority: false, burned: false },
            { id: 'dc-17', type: 'dc', name: 'ЦОД “Adamant”', address: "Харківське шосе", lat: 50.4222118, lon: 30.6524895, priority: false, burned: false },
            { id: 'dc-18', type: 'dc', name: 'ЦОД “GigaCentr”', address: "вул. Васильківська, 1 (Голосіїв)", lat: 50.3918505, lon: 30.4849897, priority: false, burned: false }
        ];

        const allLocations = [...gasStations, ...dataCenters];

        // ОСНОВНІ ШАРИ: Esri World Street Map як основа (ЖОДНОГО CARTO ТА ЖОДНОГО 403)
        const esriStreet = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri',
            maxZoom: 19
        });

        const esriSat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri &mdash; Satellite',
            maxZoom: 19
        });

        const esriTopo = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri &mdash; Topo',
            maxZoom: 19
        });

        // Ініціалізація карти
        const map = L.map('map', {
            center: [50.4501, 30.5234],
            zoom: 12,
            zoomControl: false,
            layers: [esriStreet]
        });

        L.control.zoom({ position: 'topleft' }).addTo(map);

        // Перемикач підкладок карти у кутку
        L.control.layers({
            "🏙️ Esri Міська карта": esriStreet,
            "🛰️ Esri Супутник": esriSat,
            "🏔️ Esri Топографічна": esriTopo
        }, null, { position: 'topleft' }).addTo(map);

        const markersLayer = L.featureGroup().addTo(map);
        let activeFilter = 'all';

        // Генерація кастомних іконок із точним голковим анкером
        function getMarkerIcon(loc) {
            let fillColor = '#2563eb';
            let strokeColor = '#ffffff';
            let iconClass = loc.type === 'gas' ? 'fa-gas-pump' : 'fa-server';
            let badgeHtml = '';

            if (loc.burned) {
                fillColor = '#dc2626';
                strokeColor = '#fca5a5';
                badgeHtml = '<div class="flame-badge">🔥</div>';
                if (loc.priority) {
                    badgeHtml += '<div class="prio-star">★</div>';
                }
            } else if (loc.type === 'dc') {
                if (loc.priority) {
                    fillColor = '#d97706';
                    strokeColor = '#fef08a';
                    badgeHtml = '<div class="prio-star">★</div>';
                } else {
                    fillColor = '#0284c7';
                    strokeColor = '#ffffff';
                }
            }

            return L.divIcon({
                className: 'custom-pin',
                html: `
                    <div class="pin-wrapper">
                        ${badgeHtml}
                        <svg class="pin-svg" viewBox="0 0 32 42" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M16 0C7.16344 0 0 7.16344 0 16C0 27.5 16 42 16 42C16 42 32 27.5 32 16C32 7.16344 24.8366 0 16 0Z" fill="${fillColor}" stroke="${strokeColor}" stroke-width="2"/>
                            <circle cx="16" cy="15" r="9.5" fill="rgba(0, 0, 0, 0.28)"/>
                        </svg>
                        <div class="pin-icon-inner">
                            <i class="fa-solid ${iconClass}"></i>
                        </div>
                    </div>
                `,
                iconSize: [32, 42],
                iconAnchor: [16, 42],       // Нижнє вістря піна точно на GPS-координатах
                popupAnchor: [0, -42]       // Спливаюче вікно відкривається рівно над верхівкою піна
            });
        }

        const listContainer = document.getElementById('location-list');
        const activeCountLabel = document.getElementById('active-count-label');

        function render() {
            markersLayer.clearLayers();
            listContainer.innerHTML = '';

            const filtered = allLocations.filter(loc => {
                if (activeFilter === 'dc') return loc.type === 'dc';
                if (activeFilter === 'dc-prio') return loc.type === 'dc' && loc.priority;
                if (activeFilter === 'gas') return loc.type === 'gas';
                if (activeFilter === 'burned') return loc.burned;
                return true;
            });

            activeCountLabel.textContent = `${filtered.length} об'єктів`;

            filtered.forEach(loc => {
                const marker = L.marker([loc.lat, loc.lon], { icon: getMarkerIcon(loc) });

                let badgeHtml = '';
                if (loc.type === 'gas') {
                    badgeHtml = loc.burned
                        ? `<span class="bg-red-500/20 text-red-400 border border-red-500/40 text-[11px] font-bold px-2 py-0.5 rounded-full inline-flex items-center gap-1"><i class="fa-solid fa-fire"></i> Згоріла АЗС</span>`
                        : `<span class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 text-[11px] font-medium px-2 py-0.5 rounded-full">Працююча АЗС</span>`;
                } else {
                    if (loc.burned) {
                        badgeHtml = `<span class="bg-red-500/20 text-red-400 border border-red-500/40 text-[11px] font-bold px-2 py-0.5 rounded-full inline-flex items-center gap-1"><i class="fa-solid fa-fire"></i> Згорілий ЦОД</span>`;
                        if (loc.priority) {
                            badgeHtml += ` <span class="bg-amber-500/20 text-amber-300 border border-amber-500/40 text-[11px] font-bold px-2 py-0.5 rounded-full inline-flex items-center gap-1"><i class="fa-solid fa-star"></i> 1-а черга</span>`;
                        }
                    } else {
                        badgeHtml = loc.priority
                            ? `<span class="bg-amber-500/20 text-amber-300 border border-amber-500/40 text-[11px] font-bold px-2 py-0.5 rounded-full inline-flex items-center gap-1"><i class="fa-solid fa-star"></i> 1-а черга</span>`
                            : `<span class="bg-sky-500/20 text-sky-300 border border-sky-500/40 text-[11px] font-medium px-2 py-0.5 rounded-full">Дата-центр</span>`;
                    }
                }

                marker.bindPopup(`
                    <div class="p-3">
                        <div class="flex items-center justify-between gap-2 mb-1.5">
                            <span class="text-[11px] uppercase tracking-wider font-semibold text-slate-400">${loc.type === 'gas' ? 'АЗС' : 'ЦОД'}</span>
                            ${badgeHtml}
                        </div>
                        <h4 class="font-bold text-sm text-white mb-1">${loc.name}</h4>
                        <p class="text-xs text-slate-300 mb-2">${loc.address}</p>
                        <div class="text-[10px] text-slate-400 font-mono pt-1.5 border-t border-slate-700/80">
                            Координати: ${loc.lat.toFixed(5)}, ${loc.lon.toFixed(5)}
                        </div>
                    </div>
                `);

                markersLayer.addLayer(marker);

                // Додавання до бічного списку
                const item = document.createElement('li');
                item.className = 'p-2.5 rounded-xl border border-slate-800 bg-slate-800/60 hover:bg-slate-800 transition cursor-pointer flex items-center gap-3';
                
                let iconBg = 'bg-blue-600/30 text-blue-400';
                let iconClass = loc.type === 'gas' ? 'fa-gas-pump' : 'fa-server';
                if (loc.burned) {
                    iconBg = 'bg-red-600/30 text-red-400';
                } else if (loc.type === 'dc') {
                    if (loc.priority) {
                        iconBg = 'bg-amber-600/30 text-amber-400';
                        iconClass = 'fa-star';
                    } else {
                        iconBg = 'bg-sky-600/30 text-sky-400';
                    }
                }

                item.innerHTML = `
                    <div class="w-8 h-8 rounded-lg ${iconBg} flex items-center justify-center shrink-0 relative">
                        <i class="fa-solid ${iconClass} text-xs"></i>
                        ${loc.burned ? '<span class="absolute -top-1 -right-1 text-[10px]">🔥</span>' : ''}
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="font-semibold text-xs text-white truncate flex items-center gap-1.5">
                            <span class="truncate">${loc.name}</span>
                            ${loc.burned ? '<span class="text-[10px] text-red-400 font-bold shrink-0">(Згорів)</span>' : ''}
                        </div>
                        <div class="text-[11px] text-slate-400 truncate">${loc.address}</div>
                    </div>
                    <div class="shrink-0 text-slate-500 text-xs">
                        <i class="fa-solid fa-chevron-right"></i>
                    </div>
                `;

                item.onclick = () => {
                    map.flyTo([loc.lat, loc.lon], 16, { duration: 1.1 });
                    setTimeout(() => marker.openPopup(), 1150);
                    if (window.innerWidth < 768) {
                        setDrawerState(false);
                    }
                };

                listContainer.appendChild(item);
            });

            if (filtered.length > 0) {
                const padding = window.innerWidth < 768 ? [40, 80] : [60, 60];
                map.fitBounds(markersLayer.getBounds(), { padding: padding, maxZoom: 13 });
            }
        }

        // Обробник кнопок перемикача режимів у шапці
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.mode-btn').forEach(b => {
                    b.classList.remove('bg-blue-600', 'text-white', 'shadow-sm');
                    b.classList.add('bg-slate-800', 'text-slate-300');
                });
                btn.classList.add('bg-blue-600', 'text-white', 'shadow-sm');
                btn.classList.remove('bg-slate-800', 'text-slate-300');
                
                activeFilter = btn.dataset.mode;
                render();
            };
        });

        // Мобільна шторка (Bottom Sheet)
        const sidebar = document.getElementById('sidebar-panel');
        const drawerToggle = document.getElementById('drawer-toggle');
        const drawerLabel = document.getElementById('drawer-label');
        const drawerIcon = document.getElementById('drawer-icon');
        let drawerOpen = false;

        function setDrawerState(open) {
            if (window.innerWidth >= 768) return;
            drawerOpen = open;
            if (drawerOpen) {
                sidebar.classList.remove('collapsed');
                drawerLabel.textContent = 'Згорнути';
                drawerIcon.classList.remove('fa-chevron-up');
                drawerIcon.classList.add('fa-chevron-down');
            } else {
                sidebar.classList.add('collapsed');
                drawerLabel.textContent = 'Показати список';
                drawerIcon.classList.remove('fa-chevron-down');
                drawerIcon.classList.add('fa-chevron-up');
            }
        }

        drawerToggle.onclick = () => setDrawerState(!drawerOpen);

        // Кнопка центрування
        document.getElementById('btn-recenter').onclick = () => {
            if (markersLayer.getLayers().length > 0) {
                const padding = window.innerWidth < 768 ? [30, 70] : [50, 50];
                map.fitBounds(markersLayer.getBounds(), { padding: padding, maxZoom: 13 });
            }
        };

        window.addEventListener('resize', () => {
            map.invalidateSize();
            if (window.innerWidth >= 768) {
                sidebar.classList.remove('collapsed');
            } else if (!drawerOpen) {
                sidebar.classList.add('collapsed');
            }
        });

        // Запуск та оновлення геометрії карти після монтування DOM
        window.addEventListener('DOMContentLoaded', () => {
            render();
            setTimeout(() => {
                map.invalidateSize();
            }, 250);
        });

        // Старт
        render();
        setTimeout(() => map.invalidateSize(), 300);
    </script>
</body>
</html>
